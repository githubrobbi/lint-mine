# Clippy configuration for the lint-mine posture. lint-mine points CLIPPY_CONF_DIR
# here, so this file is used instead of the repository's own clippy.toml.
#
# Production code: strict. Test code: unwrap, expect, panic, dbg! and print are
# welcome, because a test that does not crash on failure is useless.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
avoid-breaking-exported-api = false
check-private-items = false
suppress-restriction-lint-in-const = true
check-inconsistent-struct-field-initializers = true
max-include-file-size = 200_000
accept-comment-above-statement = true
accept-comment-above-attributes = true

# Not a published library: internal refactoring should not be blocked by
# "this would break downstream crates" findings.
#
# Thresholds (cognitive-complexity-threshold, too-many-lines-threshold,
# type-complexity-threshold, enum-variant-size-threshold) stay at clippy's
# defaults; a violation gets a targeted #[expect(lint, reason = "...")], never a
# blanket raise. check-private-items is off because it produces many findings on
# private helpers whose error conditions are evident from the return type.
#
# doc-valid-idents extends clippy's list of names that may appear in prose
# without backticks; add the product names your docs use, e.g.
#   doc-valid-idents = ["OpenSSL", ".."]

[package]
name = "lint-mine"
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/githubrobbi/lint-mine"
description = "Run the strictest clippy and rustfmt posture on a repository, report only what lands inside your own diff"

[[bin]]
name = "lint-mine"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
